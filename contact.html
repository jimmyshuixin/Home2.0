<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="写信给虚宁" />
    <title>联系我 - 虚宁</title>
    <link rel="icon" href="/assets/32-BRYYMFZs.png" />
    <script type="module" crossorigin src="/assets/styles-C3JYDah1.js"></script>
    <script type="module" crossorigin src="/assets/static-page-E2Wfa5J1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/styles-BzPw0-B_.css">
  </head>
  <body>
    <main class="static-shell">
      <nav class="static-nav">
        <a class="brand-mark" href="/">
          <span class="brand-seal">虚</span>
          <span><strong>虚宁</strong><small>Xu Ning's Space</small></span>
        </a>
        <button class="icon-button" type="button" data-theme-toggle aria-label="切换主题">☾</button>
      </nav>

      <section class="static-card contact-static">
        <div>
          <p class="static-kicker">Letter</p>
          <h1>写信给我</h1>
          <p>独立联系页仍然保留。你也可以回到主页，在“留言 & 尾声”里切换写信或贴纸弹幕。</p>
          <a class="paper-button paper-button--small" href="/#contact">回到主页留言</a>
        </div>

        <form class="paper-form" data-contact-form>
          <label>
            <span>你的昵称</span>
            <input name="name" autocomplete="name" required />
          </label>
          <label>
            <span>邮箱 Address</span>
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>想对我说的话</span>
            <textarea name="message" maxlength="500" rows="6" required></textarea>
          </label>
          <button class="paper-button paper-button--dark" type="submit">发送信件</button>
          <p class="form-status" data-form-status></p>
        </form>
      </section>
    </main>
  </body>
</html>
