name: Check Bilibili server connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check public API connectivity without account credentials
        run: node scripts/v3/bilibili-probe.mjs
